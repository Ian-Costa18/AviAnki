[project]
name = "avianki"
version = "1.0.1"
description = "Build Anki decks for learning the birds of a region by photo and by sound"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ian Costa" },
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["anki", "birds", "flashcards", "ornithology"]
dependencies = [
    "bs4>=0.0.2",
    "genanki>=0.13.1",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
catalog = ["jsonschema>=4", "Pillow>=10", "tomli>=2; python_version < '3.11'"]
# BirdNET audio verification (ADR 0011). birdnet 1.x runs the v2.4 TFLite model through
# ai-edge-litert (no TensorFlow), which ships wheels for CPython 3.11-3.13 only; on 3.14 the
# extra installs nothing and avianki.media.verify raises VerifyUnavailable.
verify = ["birdnet>=1.1.1; python_version >= '3.11' and python_version < '3.14'"]

[project.scripts]
avianki = "avianki.cli:main"
avianki-catalog = "avianki.catalog_cli:main"

[project.urls]
Repository = "https://github.com/Ian-Costa18/avianki"
Issues = "https://github.com/Ian-Costa18/avianki/issues"

[build-system]
requires = ["uv_build>=0.11.7,<0.13"]
build-backend = "uv_build"

# Keep untracked working files out of the sdist and wheel: uv_build packs whatever is in
# src/avianki, tracked or not.
[tool.uv.build-backend]
source-exclude = ["**/*.apkg", "**/*.log", "**/.env", "**/*.orig", "**/*.rej", "**/*.bak", "**/*.swp", "**/*.tmp", "**/.DS_Store"]
wheel-exclude = ["**/*.apkg", "**/*.log", "**/.env", "**/*.orig", "**/*.rej", "**/*.bak", "**/*.swp", "**/*.tmp", "**/.DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["integration: hits the real network; run with --integration"]
filterwarnings = ["ignore::DeprecationWarning:cached_property"]

# Dead code (CI runs `uv run --with vulture vulture`). `decl` is HTMLParser.handle_decl's
# parameter: the override must keep the name, and never reads it.
[tool.vulture]
paths = ["src"]
min_confidence = 80
ignore_names = ["decl"]

# Declared vs imported dependencies (CI runs `uv run --with deptry deptry src`). media/verify.py imports birdnet and
# its runtime ai_edge_litert through importlib, so deptry cannot see the first used or the
# second declared; the verify extra's birdnet brings ai-edge-litert.
[tool.deptry.per_rule_ignores]
DEP001 = ["ai_edge_litert"]
DEP002 = ["birdnet"]

[dependency-groups]
dev = [
    "anki>=26.9",
    "playwright>=1.40.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "python-dotenv[cli]>=1.2.2",
    "ruff>=0.15.11",
    "ty>=0.0.31",
]
