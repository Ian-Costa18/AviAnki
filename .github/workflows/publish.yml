# Publishing to PyPI needs the maintainer's explicit approval, so pushing a tag never publishes
# (issue #47). A maintainer starts this workflow from the Actions tab and names the tag, after the
# version is bumped, merged, tagged and the GitHub release exists (CONTRIBUTING.md, "Publishing a
# release"). The `pypi` environment's protection rules are a second gate before the upload.
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish, e.g. v1.0.0 (must equal v<project.version>)"
        required: true
        type: string

jobs:
  sanity-test:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    # The exact commit the tests ran on, so the publish job builds that commit even if the tag moves.
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Record the commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Fail before anything is built or uploaded if the tag and pyproject.toml disagree.
      - name: Check the tag matches the project version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag '$TAG' does not match project.version '$version' in pyproject.toml (expected 'v$version')."
            exit 1
          fi

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --group dev --extra catalog

      # Same as ci.yml: the browser tests skip when a browser is missing, so the install is strict.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium webkit

      - name: Run sanity tests
        run: uv run pytest

  publish:
    needs: sanity-test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sanity-test.outputs.sha }}

      - uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
