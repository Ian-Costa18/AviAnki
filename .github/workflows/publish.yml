# Pushing a `v*` tag publishes to PyPI after the tests pass, then creates the GitHub release if it
# doesn't exist yet (maintainer's decision, 2026-10-01; this reverses issue #47's "pushing a tag
# never publishes"). Bump the version, merge, then tag the merge commit (CONTRIBUTING.md,
# "Publishing a release"). The tag must equal v<project.version> or nothing is built. The `pypi`
# environment's protection rules are an optional extra gate before the upload. Run manually from
# the Actions tab with a tag name to retry a failed publish.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release tag to publish, e.g. v0.10.0 (must equal v<project.version>)"
        required: true
        type: string

jobs:
  sanity-test:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    # The exact commit the tests ran on, so the publish job builds that commit even if the tag moves.
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Record the commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Fail before anything is built or uploaded if the tag and pyproject.toml disagree.
      - name: Check the tag matches the project version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag '$TAG' does not match project.version '$version' in pyproject.toml (expected 'v$version')."
            exit 1
          fi

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --group dev --extra catalog

      # Same as ci.yml: the browser tests skip when a browser is missing, so the install is strict.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium webkit

      - name: Run sanity tests
        run: uv run pytest

  publish:
    needs: sanity-test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sanity-test.outputs.sha }}

      - uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  # Creates the GitHub release from the tag once PyPI has the files, unless one already exists.
  # The notes are the version's CHANGELOG section, or GitHub's generated notes if there is none.
  release:
    needs: [sanity-test, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sanity-test.outputs.sha }}

      - name: Create the GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it alone."
            exit 0
          fi
          version="${TAG#v}"
          awk -v v="$version" '/^## /{found = ($2 == v); next} found' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
