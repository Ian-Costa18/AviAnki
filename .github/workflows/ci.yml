name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --group dev --extra catalog

      # The browser tests (tests/web) skip themselves when a browser is missing, so a failed
      # install would hide them: keep this step strict. The download is cached per lockfile; the
      # system libraries (--with-deps) are apt packages and are installed on every run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium webkit

      - name: Run tests
        run: uv run pytest

      - name: Lint
        if: matrix.python-version == '3.14'
        run: uv run ruff check src/ tests/

      - name: Type check
        if: matrix.python-version == '3.14'
        run: uv run ty check src/

      # Settings for vulture and deptry are in pyproject.toml. jscpd fails above 1% copy-paste;
      # notetypes.json is generated (one CSS string per note type), so it is left out.
      - name: Dead code, dependencies and duplication
        if: matrix.python-version == '3.14'
        run: |
          uv run --with vulture==2.16 vulture
          uv run --with deptry==0.25.1 deptry src
          npx -y jscpd@4 src tests web --ignore "**/fixtures/**,**/vendor/**,**/notetypes.json" --threshold 1 --reporters console
