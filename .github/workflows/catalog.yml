# The catalog build (spec §4, ADR 0014): monthly and on demand, `avianki-catalog build` against
# the previous release's state, then validate, release and deploy to GitHub Pages.
#
#   1. Load state: the newest `catalog-*` release's catalog.tar.gz becomes `previous/`.
#   2. Build: incremental, sticky, BirdNET-verified. A run that hits its time budget publishes
#      what it has (ADR 0014); the unfinished species keep their previous entries.
#   3. Gate: a non-zero exit (validation failed, or anything else) fails the job before
#      anything is released or deployed. The HTTP cache and the review artifacts are still saved.
#   4. Release `catalog-YYYY-MM-DD` (tarball + build report), assemble the Pages tree, deploy.
#
# `publish: false` stops after the gate and the review artifacts: no release, no deploy.
# The `github-pages` environment only accepts deployments from `main`.
name: Catalog

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated region slugs, e.g. us-ri,us-dc (empty = every region)"
        required: false
        default: ""
      max_species:
        description: "Build only the N most widespread species (empty = all; a dev run)"
        required: false
        default: ""
      allow_shrink:
        description: "Downgrade the shrink checks to warnings (a deliberate drop, ADR 0014)"
        type: boolean
        required: false
        default: false
      publish:
        description: "Release and deploy. Off = build, validate and upload the review artifacts only"
        type: boolean
        required: false
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The hosted-runner cap is 360 minutes. The build stops starting new work after 300
    # (--time-budget-minutes below), which leaves the rest for packing, release and upload.
    timeout-minutes: 355
    concurrency:
      group: catalog-build
      cancel-in-progress: false
    permissions:
      contents: write # release create/upload
    env:
      # `inputs` is empty on the cron trigger, so the schedule counts as publish=true.
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # birdnet downloads its 77 MB model on first use into $BIRDNET_APP_DATA (its default on
      # Linux is ~/.local/share/birdnet). Pinning the location makes the cache path explicit.
      BIRDNET_APP_DATA: ${{ github.workspace }}/.cache/birdnet
    steps:
      - uses: actions/checkout@v4

      # 3.13, not 3.14: the optional birdnet dependency has no wheels for 3.14 (see the
      # `verify` extra in pyproject.toml).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --locked --python 3.13 --extra catalog --extra verify --no-dev

      # The model file never changes for a given version (acoustic v2.4, tf, fp32), so the key is
      # fixed. Bump the -v1 suffix to force a re-download.
      - name: Restore BirdNET model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/birdnet
          key: birdnet-acoustic-2.4-tf-fp32-v1

      # A re-run restores the newest cache, so a partly finished first build resumes instead of
      # starting over. The cache holds API responses and the daily request ledger (_budget/);
      # media downloads are never cached (they use cache=False in the sources).
      - name: Restore HTTP cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/http
          key: catalog-http-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            catalog-http-

      # No catalog-* release yet is fine (the first ever build); a release that exists but
      # can't be downloaded fails the job, so "no previous" is never silent.
      - name: Load previous catalog
        id: previous
        run: |
          bash scripts/fetch_latest_catalog.sh previous --allow-none
          if grep -q '^found=true$' "$GITHUB_OUTPUT"; then
            echo "Previous catalog: \`$(grep '^tag=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No previous catalog: this is the first build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build catalog
        env:
          FOUND_PREVIOUS: ${{ steps.previous.outputs.found }}
          REGIONS: ${{ inputs.regions }}
          MAX_SPECIES: ${{ inputs.max_species }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        run: |
          args=(build --out build --cache-dir .cache/http --time-budget-minutes 300)
          if [ "$FOUND_PREVIOUS" = "true" ]; then
            args+=(--previous previous)
          fi
          if [ -n "$REGIONS" ]; then
            args+=(--regions "$REGIONS")
          fi
          if [ -n "$MAX_SPECIES" ]; then
            args+=(--max-species "$MAX_SPECIES")
          fi
          if [ "$ALLOW_SHRINK" = "true" ]; then
            args+=(--allow-shrink)
          fi
          # --no-sync: keep the environment installed above (uv run would re-sync without the extras).
          uv run --no-sync --python 3.13 avianki-catalog "${args[@]}"

      # ---- always: the report, the review artifacts and both caches -------------------------

      # A step summary is capped at 1 MiB, so a very long report is cut (the artifact has it all).
      - name: Job summary
        if: always()
        run: |
          if [ -f build/build-report.md ]; then
            head -c 900000 build/build-report.md >> "$GITHUB_STEP_SUMMARY"
            if [ "$(wc -c < build/build-report.md)" -gt 900000 ]; then
              printf '\n\n(report truncated here; see the build-review artifact)\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No build report was written; see the build step's log." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "Review artifacts: \`build-review\` (report, contact sheet, log) and \`build-review-media\`"
            echo "(the contact sheet with the media it links to; extract it and open contact-sheet.html)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-review
          path: |
            build/build-report.md
            build/contact-sheet.html
            build/catalog.log
          retention-days: 30
          if-no-files-found: warn

      # contact-sheet.html links its images and audio as site/media/<hash>.<ext>, relative to
      # build/. The upload's common root is build/, so extracting this artifact keeps the links
      # working. Already-compressed media, so no zip compression.
      - name: Upload contact sheet with its media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-review-media
          path: |
            build/contact-sheet.html
            build/site/media/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn

      # The cache should hold API JSON only. If it ever grows past what is sensible, keep just the
      # daily request ledger so the save stays far below Actions' 10 GB per-repo cache limit.
      - name: Bound HTTP cache
        if: always()
        run: |
          [ -d .cache/http ] || exit 0
          size_mb=$(du -sm .cache/http | cut -f1)
          echo "HTTP cache: ${size_mb} MB"
          echo "- HTTP cache size: ${size_mb} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size_mb" -gt 2000 ]; then
            echo "::warning::HTTP cache is ${size_mb} MB (over 2000); dropping everything but the request ledger"
            find .cache/http -mindepth 1 -maxdepth 1 ! -name _budget -exec rm -rf {} +
          fi

      # Saved even when the build failed, so the re-run only fetches what is missing.
      - name: Save HTTP cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/http
          key: catalog-http-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check BirdNET model location
        if: always() && steps.model-cache.outputs.cache-hit != 'true'
        run: |
          if [ -z "$(find .cache/birdnet -name '*.tflite' 2>/dev/null)" ]; then
            echo "::warning::no BirdNET model under .cache/birdnet; birdnet may have ignored BIRDNET_APP_DATA, so the model cache is not being saved"
          fi

      - name: Save BirdNET model cache
        if: always() && steps.model-cache.outputs.cache-hit != 'true' && hashFiles('.cache/birdnet/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/birdnet
          key: birdnet-acoustic-2.4-tf-fp32-v1

      # ---- publish: only reached when the build (and so the gate) succeeded ------------------

      # Assemble before releasing, so an oversize site (ADR 0003) fails before anything is published.
      - name: Assemble Pages site
        if: env.PUBLISH == 'true'
        run: python scripts/assemble_site.py build/site _site

      # The tag date comes from the manifest's catalog_version (the date the build stamped), never
      # from the clock here, so the tag and the manifest cannot disagree across midnight UTC.
      # A second run on the same day (ADR 0014 allows two for the first build) replaces the assets.
      - name: Release
        if: env.PUBLISH == 'true'
        run: |
          version=$(python -c "import json; print(json.load(open('build/site/manifest.json', encoding='utf-8'))['catalog_version'])")
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::manifest catalog_version is not a date: $version"
            exit 1
          fi
          tag="catalog-$version"

          tar -czf catalog.tar.gz -C build/site .

          {
            echo "Catalog build $version."
            echo ""
            awk '/^\*\*Validation gate/ {print; print ""} /^## Summary/ {s=1; next} /^## / {s=0} s && NF {print}' build/build-report.md
            echo ""
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > release-notes.md

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" catalog.tar.gz build/build-report.md --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" catalog.tar.gz build/build-report.md \
              --title "Catalog $version" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi
          echo "Released \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # Keeps .nojekyll; v4+ drops dotfiles by default.
          include-hidden-files: true

  deploy:
    needs: build
    # Same rule as the build job's PUBLISH: the cron trigger has no inputs, and counts as publish.
    if: github.event_name == 'schedule' || inputs.publish
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
